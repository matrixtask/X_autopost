<style>
  :root {
    --bg: #f5f6f8; --card: #ffffff; --text: #1c1e21; --sub: #65707c;
    --line: #e3e6ea; --accent: #1d7fdb; --ok: #1a9e5c; --ng: #c9483c; --warn: #b07514;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14171a; --card: #1e2328; --text: #e8eaed; --sub: #9aa4ae; --line: #313940; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; }
  header { position: sticky; z-index: 2; top: 0; background: var(--card); border-bottom: 1px solid var(--line); padding: 12px 16px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0 auto 0 0; }
  .tabs { display: flex; gap: 6px; overflow-x: auto; padding: 10px 12px; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { border: 1px solid var(--line); background: var(--card); color: var(--sub); border-radius: 999px; padding: 6px 12px; font-size: 13px; white-space: nowrap; cursor: pointer; }
  .tab.active { border-color: var(--accent); color: var(--accent); font-weight: 600; }
  main { padding: 0 12px 40px; max-width: 640px; margin: 0 auto; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
  .meta { display: flex; gap: 8px; flex-wrap: wrap; font-size: 12px; color: var(--sub); margin-bottom: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 2px 8px; font-size: 11px; font-weight: 600; }
  .b-ready { background: rgba(176,117,20,.12); color: var(--warn); }
  .b-approved, .b-scheduled { background: rgba(29,127,219,.12); color: var(--accent); }
  .b-posted { background: rgba(26,158,92,.12); color: var(--ok); }
  .b-stock, .b-draft { background: rgba(101,112,124,.12); color: var(--sub); }
  .b-rejected, .b-failed { background: rgba(201,72,60,.12); color: var(--ng); }
  .body-text { white-space: pre-wrap; font-size: 15px; line-height: 1.7; }
  textarea { width: 100%; min-height: 110px; font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px; }
  .reason { font-size: 12px; color: var(--sub); margin-top: 8px; }
  .actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  button { border: none; border-radius: 8px; padding: 10px 14px; font-size: 14px; font-weight: 600; cursor: pointer; }
  .approve { background: var(--ok); color: #fff; }
  .reject { background: transparent; color: var(--ng); border: 1px solid var(--ng); }
  .edit, .ghost { background: transparent; color: var(--sub); border: 1px solid var(--line); }
  .save { background: var(--accent); color: #fff; }
  .empty { text-align: center; color: var(--sub); padding: 48px 0; }
  #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-size: 13px; opacity: 0; transition: opacity .25s; pointer-events: none; }
  #toast.show { opacity: 1; }
  .sec { font-size: 14px; margin: 0 0 10px; }
  .bar-row { display: grid; grid-template-columns: 4.2em 1fr 9.5em; gap: 8px; align-items: center; margin-bottom: 6px; font-size: 12.5px; }
  .bar-lbl { color: var(--sub); text-align: right; }
  .bar-track { background: var(--bg); border: 1px solid var(--line); border-radius: 4px; height: 16px; position: relative; }
  .bar-fill { position: absolute; inset: 0 auto 0 0; background: var(--accent); border-radius: 4px; opacity: .75; }
  .bar-val { color: var(--sub); white-space: nowrap; }
  .top-row { border-top: 1px solid var(--line); padding-top: 10px; margin-top: 10px; }
  .top-row:first-of-type { border-top: none; margin-top: 0; padding-top: 0; }
  .atiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 12px; }
  .atile { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .atile.hero { border-color: var(--accent); }
  .atile.hero .abig { color: var(--accent); }
  .abig { font-size: 22px; font-weight: 700; line-height: 1.3; }
  .acap { font-size: 11.5px; color: var(--sub); }
  .bar-fill.best { opacity: 1; }
  .axis-zero { position: absolute; left: 50%; top: -2px; bottom: -2px; width: 1px; background: var(--sub); opacity: .5; }
  .bdot { position: absolute; top: 50%; width: 7px; height: 7px; border-radius: 50%; background: var(--text); opacity: .5; transform: translate(-50%, -50%); }
  .scatter { width: 100%; height: auto; }
  .scatter text { fill: var(--sub); font-size: 11px; }
  .scatter .gl { stroke: var(--line); stroke-width: 1; }
  .scatter .pt { fill: var(--accent); stroke: var(--card); stroke-width: 2; }
  .atable { border-collapse: collapse; width: 100%; font-size: 11.5px; margin-top: 8px; }
  .atable th, .atable td { padding: 4px 8px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
  .atable th { color: var(--sub); font-weight: 600; }
  .atable td.tx, .atable th:first-child { text-align: left; }
  button:disabled { opacity: .5; cursor: wait; }
  button:focus-visible, input:focus-visible, textarea:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .toolbar { max-width: 640px; margin: auto; padding: 0 12px 12px; }
  #search { width: 100%; padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); color: var(--text); font: inherit; }
  #activity { min-height: 2.5em; padding: 10px 0 0; font-size: 13px; color: var(--sub); line-height: 1.5; overflow-wrap: anywhere; }
  #activity.error { color: var(--ng); }
  .batch-menu { position: relative; }
  summary { cursor: pointer; }
  .batch-menu summary { padding: 10px; font-size: 13px; color: var(--sub); }
  .batch-actions { position: absolute; right: 0; top: 100%; width: 230px; padding: 10px; display: grid; gap: 8px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 8px 24px #0002; }
  .body-text, .reason { overflow-wrap: anywhere; }
  .review { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 10px; font-size: 13px; color: var(--sub); }
  .review .reason { white-space: pre-wrap; }
  .list-count { font-size: 12px; color: var(--sub); margin: 0 0 10px; }
  .pager { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin: 20px 0; font-size: 13px; }
  .card[aria-busy="true"] { border-color: var(--accent); }
  #toast { max-width: calc(100vw - 24px); width: max-content; border-radius: 12px; z-index: 3; }
  @media (max-width: 480px) { header { padding: 10px 12px; } header h1 { font-size: 14px; } .actions button { min-height: 44px; } }
</style>

<header>
  <h1>X Autopost</h1>
  <button class="ghost" id="reload" onclick="load()">再読込</button>
  <details class="batch-menu"><summary>一括操作</summary><div class="batch-actions">
    <button class="ghost" data-mutation onclick="refineNow()">リライト・再審査</button>
    <button class="ghost" data-mutation onclick="approveAll()">承認待ちを全承認</button>
    <button class="ghost" data-mutation onclick="scheduleNow()">承認済みを予約</button>
    <button class="reject" data-mutation onclick="forceApproveStock()">保留も全承認して予約</button>
  </div></details>
</header>
<div class="tabs" id="tabs"></div>
<div class="toolbar"><input type="search" id="search" aria-label="投稿を検索" placeholder="本文・テーマ・採点コメントを検索" oninput="searchPosts(this.value)"><div id="activity" role="status" aria-live="polite"></div></div>
<main id="list"><div class="empty">読み込み中…</div></main>
<div id="toast" role="status" aria-live="polite"></div>

<script>
  var TOKEN = '<?= token ?>';
  var TABS = [
    { key: 'ready', label: '承認待ち' },
    { key: 'scheduled', label: '予約済み' },
    { key: 'approved', label: '承認済み' },
    { key: 'stock', label: 'ストック' },
    { key: 'draft', label: '審査待ち' },
    { key: 'failed', label: '投稿失敗' },
    { key: 'posted', label: '投稿済み' },
    { key: 'all', label: 'すべて' },
    { key: 'analytics', label: '分析' },
  ];
  var STATUS_LABEL = { draft: '審査待ち', stock: '保留', ready: '承認待ち', approved: '承認済み', scheduled: '予約済み', posted: '投稿済み', rejected: '却下', failed: '失敗' };
  var CATEGORY_LABEL = { evergreen: '定番', news: '時事', neta: 'ネタ', manual: '手動' };
  var posts = [];
  var activeTab = 'ready';
  var PAGE_SIZE = 30, page = 0, query = '', editors = Object.create(null);
  var busy = false, busyId = '', loading = false, loadVersion = 0, toastTimer;

  function activity(message, error) {
    var el = document.getElementById('activity');
    el.textContent = message; el.className = error ? 'error' : '';
  }

  function updateControls() {
    document.getElementById('reload').disabled = busy || loading;
    document.getElementById('reload').textContent = loading ? '読込中…' : '再読込';
    document.querySelectorAll('[data-mutation]').forEach(function (el) { el.disabled = busy || loading; });
    document.querySelectorAll('textarea').forEach(function (el) { el.disabled = busy && el.id === 'ta-' + busyId; });
  }

  function beginMutation(message, id) {
    if (busy || loading) return false;
    busy = true; busyId = id || ''; loadVersion++;
    activity(message); updateControls();
    var card = document.getElementById('card-' + busyId);
    if (card) card.setAttribute('aria-busy', 'true');
    return true;
  }

  function finishMutation(message, error) {
    var card = document.getElementById('card-' + busyId);
    if (card) card.setAttribute('aria-busy', 'false');
    busy = false; busyId = ''; activity(message, error); updateControls();
    if (!error) toast(message);
  }

  function toast(msg) {
    var el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove('show'); }, 4500);
  }

  function renderTabs() {
    document.getElementById('tabs').innerHTML = TABS.map(function (t) {
      var count = t.key === 'analytics' ? '' :
        ' ' + (t.key === 'all' ? posts.length : posts.filter(function (p) { return p.status === t.key; }).length);
      return '<button class="tab' + (activeTab === t.key ? ' active' : '') + '" onclick="setTab(\'' + t.key + '\')">' + t.label + count + '</button>';
    }).join('');
  }

  var analyticsData = null, analyticsLoading = false;
  function setTab(key) {
    activeTab = key; page = 0;
    document.getElementById('search').hidden = key === 'analytics';
    renderTabs();
    if (key === 'analytics') { renderAnalytics(); } else { renderList(); }
  }

  function renderAnalytics() {
    var el = document.getElementById('list');
    if (!analyticsData) {
      el.innerHTML = '<div class="empty">集計中…</div>';
      if (analyticsLoading) return;
      analyticsLoading = true;
      google.script.run
        .withSuccessHandler(function (json) { analyticsLoading = false; analyticsData = JSON.parse(json); if (activeTab === 'analytics') renderAnalytics(); })
        .withFailureHandler(function (e) {
          analyticsLoading = false;
          if (activeTab === 'analytics') el.innerHTML = '<div class="empty">' + esc(e.message) + '<p><button class="ghost" onclick="renderAnalytics()">再試行</button></p></div>';
        })
        .api_analytics(TOKEN);
      return;
    }
    var d = analyticsData;
    var catLabel = function (c) { return CATEGORY_LABEL[c] || c; };

    // バー(平均) + 点(個々の投稿)。点のスケールは全投稿の最大インプ
    function bars(list, withDots) {
      var max = Math.max.apply(null, list.map(function (x) { return x.impAvg; }).concat([1]));
      var maxPt = Math.max.apply(null, list.reduce(function (a, x) { return a.concat(x.points || []); }, [1]));
      return list.map(function (x, i) {
        var dots = withDots ? (x.points || []).map(function (v) {
          return '<span class="bdot" style="left:' + Math.round(100 * v / maxPt) + '%" title="' + v + ' imp"></span>';
        }).join('') : '';
        var clickPart = x.clickRate !== null && x.clickRate !== undefined ? ' / 👤' + x.clickRate + '%' : '';
        return '<div class="bar-row"><span class="bar-lbl">' + esc(x.key) + '</span>' +
          '<span class="bar-track"><span class="bar-fill' + (i === 0 ? ' best' : '') + '" style="width:' + Math.round(100 * x.impAvg / max) + '%"></span>' + dots + '</span>' +
          '<span class="bar-val">' + x.impAvg + ' / ❤️' + x.likesAvg + clickPart + ' (n=' + x.n + ')</span></div>';
      }).join('');
    }

    // 統計タイル（フォロワーが最終目的なので先頭）
    var bestSlot = d.bySlot[0];
    var f = d.follow;
    var followTile = f
      ? '<div class="atile hero"><div class="acap">フォロワー</div><div class="abig">' + f.current + '人</div><div class="acap">' +
        (f.gained7 === null ? '記録開始（増減は明日から）' : '直近7日 ' + (f.gained7 >= 0 ? '+' : '') + f.gained7 + ' / 記録開始から ' + (f.gainedAll >= 0 ? '+' : '') + f.gainedAll + '（' + f.days + '日）') +
        '</div></div>'
      : '<div class="atile hero"><div class="acap">フォロワー</div><div class="abig">未記録</div><div class="acap">snapshotFollowers を実行すると記録開始</div></div>';
    var tiles =
      '<div class="atiles">' + followTile +
      '<div class="atile"><div class="acap">最強時間帯</div><div class="abig">' + (bestSlot ? esc(bestSlot.key) : '-') + '</div><div class="acap">' + (bestSlot ? '平均 ' + bestSlot.impAvg + ' imp (n=' + bestSlot.n + ')' : '') + '</div></div>' +
      '<div class="atile"><div class="acap">計測済み投稿</div><div class="abig">' + d.total.n + '件</div><div class="acap">インプ計 ' + d.total.imp + ' / ❤️計 ' + d.total.likes + '</div></div>' +
      '<div class="atile"><div class="acap">採点×インプ相関</div><div class="abig">' + (d.corr === null ? '-' : 'r = ' + d.corr) + '</div><div class="acap">自動投稿 ' + d.scatter.length + '件で算出</div></div>' +
      '</div>';

    // フォロワー推移
    var followChart = '';
    if (f && f.series.length >= 2) {
      var fs = f.series;
      var lo = Math.min.apply(null, fs.map(function (p) { return p.followers; }));
      var hi = Math.max.apply(null, fs.map(function (p) { return p.followers; }));
      var span = Math.max(1, hi - lo);
      var pts = fs.map(function (p, i) {
        return (20 + i / Math.max(1, fs.length - 1) * 520).toFixed(1) + ',' + (110 - (p.followers - lo) / span * 90).toFixed(1);
      }).join(' ');
      followChart = '<div class="card"><h3 class="sec">フォロワー推移（直近' + fs.length + '日）</h3>' +
        '<svg viewBox="0 0 560 130" class="scatter" role="img" aria-label="フォロワー数の推移">' +
        '<polyline points="' + pts + '" fill="none" stroke="var(--accent)" stroke-width="2"/>' +
        '<text x="20" y="126">' + esc(fs[0].date) + '（' + lo + '人）</text>' +
        '<text x="540" y="126" text-anchor="end">' + esc(fs[fs.length - 1].date) + '（' + hi + '人）</text>' +
        '</svg></div>';
    }

    // 採点×インプの散布図(SVG)
    var scatterSvg = '';
    if (d.scatter.length >= 3) {
      var sMin = Math.min.apply(null, d.scatter.map(function (p) { return p.score; })) - 3;
      var sMax = Math.max.apply(null, d.scatter.map(function (p) { return p.score; })) + 3;
      var iMax = Math.max.apply(null, d.scatter.map(function (p) { return p.imp; })) * 1.1 || 1;
      var X = function (s) { return 46 + (s - sMin) / (sMax - sMin) * 494; };
      var Y = function (v) { return 220 - v / iMax * 195; };
      scatterSvg = '<div class="card"><h3 class="sec">採点スコア × オーガニックインプ' + (d.corr !== null ? '（r = ' + d.corr + '）' : '') + '</h3>' +
        '<svg viewBox="0 0 560 245" class="scatter" role="img" aria-label="採点とインプレッションの散布図">' +
        '<line class="gl" x1="46" y1="220" x2="540" y2="220"/>' +
        '<line class="gl" x1="46" y1="122" x2="540" y2="122"/>' +
        '<text x="40" y="224" text-anchor="end">0</text>' +
        '<text x="40" y="126" text-anchor="end">' + Math.round(iMax / 2.2 / 10) * 10 + '</text>' +
        '<text x="' + X(sMin + 3) + '" y="238">' + Math.round(sMin + 3) + '点</text>' +
        '<text x="' + X(sMax - 3) + '" y="238" text-anchor="end">' + Math.round(sMax - 3) + '点</text>' +
        d.scatter.map(function (p) {
          return '<circle class="pt" cx="' + Math.round(X(p.score)) + '" cy="' + Math.round(Y(p.imp)) + '" r="6"><title>' + esc(p.text) + ' — ' + p.score + '点 / ' + p.imp + ' imp</title></circle>';
        }).join('') + '</svg>' +
        '<div class="reason">点にカーソル/長押しで内訳。手動投稿(採点なし)は含みません。</div></div>';
    }

    // 全データ表(折りたたみ)
    var tableHtml =
      '<div class="card"><details><summary class="sec" style="cursor:pointer">全データ (' + d.table.length + '件)</summary>' +
      '<div style="overflow-x:auto"><table class="atable"><thead><tr>' +
      '<th>投稿</th><th>枠</th><th>種別</th><th>点</th><th>👁</th><th>❤️</th><th>🔁</th><th>💬</th><th>日時</th></tr></thead><tbody>' +
      d.table.map(function (p) {
        return '<tr><td class="tx">' + esc(p.text.slice(0, 40)) + '</td><td>' + esc(p.slot) + '</td><td>' + esc(catLabel(p.category)) + '</td>' +
          '<td>' + (p.score === null ? '-' : p.score) + '</td><td>' + p.imp + (p.promoted ? '💰' : '') + '</td><td>' + p.likes + '</td><td>' + p.rt + '</td><td>' + p.rep + '</td>' +
          '<td>' + esc(p.posted_at) + '</td></tr>';
      }).join('') + '</tbody></table></div></details></div>';

    // 軸別の効き方（どの採点軸が成果と相関しているか）
    var axesHtml = (d.axes || []).filter(function (m) {
      return m.ranked && m.ranked.some(function (x) { return x.corr !== null; });
    }).map(function (m) {
      var maxAbs = Math.max.apply(null, m.ranked.map(function (x) { return x.corr === null ? 0 : Math.abs(x.corr); }).concat([0.3]));
      return '<div class="card"><h3 class="sec">軸別の効き方（成果指標: ' + esc(m.outcomeName) + ' / n=' + m.sampleSize + '）</h3>' +
        m.ranked.filter(function (x) { return x.corr !== null; }).map(function (x) {
          var w = Math.round(Math.abs(x.corr) / maxAbs * 48);
          var neg = x.corr < 0;
          return '<div class="bar-row"><span class="bar-lbl">' + esc(x.label) + '</span>' +
            '<span class="bar-track"><span class="bar-fill" style="left:50%;width:' + w + '%;' +
            (neg ? 'transform:translateX(-100%);opacity:.45;' : '') + '"></span>' +
            '<span class="axis-zero"></span></span>' +
            '<span class="bar-val">' + (x.corr >= 0 ? '+' : '') + x.corr +
            ' / 寄与' + x.share + '% (n=' + x.n + ')</span></div>';
        }).join('') +
        '<div class="reason">全体スコア = 各軸のスコア × ここに出ている相関、の内積を0〜100に正規化したものです。' +
        '中央の線が相関0で、右に伸びるほど「その軸が高いポストほど成果が出ている」。' +
        '<b>左に伸びた軸は減点として働きます</b>（高いほど成果が下がっている軸）。' +
        (m.updated ? '相関は実測から自動更新済みです。' : '各軸' + m.minSamples + '件たまると自動更新します。') +
        '</div></div>';
    }).join('');

    el.innerHTML =
      tiles + followChart + axesHtml +
      '<div class="card"><h3 class="sec">時間帯別 平均インプ（バー=平均 / 点=個々の投稿 / 👤=プロフクリック率）</h3>' + bars(d.bySlot, true) + '</div>' +
      '<div class="card"><h3 class="sec">曜日別 平均インプ</h3>' + bars(d.byDay, false) + '</div>' +
      '<div class="card"><h3 class="sec">カテゴリ別 平均インプ</h3>' + bars(d.byCat.map(function (x) { return { key: catLabel(x.key), n: x.n, impAvg: x.impAvg, likesAvg: x.likesAvg, engRate: x.engRate, clickRate: x.clickRate, points: x.points }; }), false) + '</div>' +
      scatterSvg +
      '<div class="card"><h3 class="sec">' + (d.hasClicks ? 'プロフィールクリック Top10（フォローに一番近い指標）' : 'オーガニックインプレッション Top10') + '</h3>' +
      d.top10.map(function (p, i) {
        return '<div class="top-row"><div class="meta">' +
          '<span class="badge b-posted">' + (i + 1) + '位</span>' +
          (p.clicks !== null ? '<span>👤' + p.clicks + (p.clickRate !== null ? '(' + p.clickRate + '%)' : '') + '</span>' : '') +
          '<span>👁' + p.imp + '</span><span>❤️' + p.likes + '</span><span>🔁' + p.rt + '</span>' +
          '<span>' + esc(catLabel(p.category)) + (p.score !== null ? ' / ' + p.score + '点' : '') + '</span>' +
          (p.promoted ? '<span>💰広告分除外済</span>' : '') +
          '<span>' + esc(p.posted_at) + '</span></div>' +
          '<div class="body-text" style="font-size:13.5px">' + esc(p.text) + '</div></div>';
      }).join('') + '</div>' +
      tableHtml +
      '<div class="card"><h3 class="sec">読むときの注意</h3><div class="reason">' +
      '最終目的はフォロワー増ですが、<b>Xは「どのポストで何人増えたか」を返しません</b>。そのため ①フォロワー数は日次スナップショットの差分、②ポスト単位は 👤プロフィールクリック（フォローの直前行動）で代替評価しています。<br>' +
      'インプはオーガニック基準（広告分は分離済み。分離できないプロモ投稿は除外）。計測時点からの経過時間で有利不利が出るため、直近の投稿は値が育ちきっていません。プロフィールクリックはAPIの制約で直近30日程度の投稿のみ取得できます。' +
      '</div></div>';
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  // タブごとの並び順: 予約済み=時刻昇順 / 承認待ち・承認済み・ストック=スコア降順 / 投稿済み=投稿時刻の新しい順
  function sortForTab(items, key) {
    var arr = items.slice();
    if (key === 'scheduled') {
      arr.sort(function (a, b) { return String(a.scheduled_at || '9999').localeCompare(String(b.scheduled_at || '9999')); });
    } else if (key === 'ready' || key === 'approved' || key === 'stock') {
      // 新旧の尺度を混ぜて順位付けしない。新尺度を含む一覧は作成順。
      if (arr.some(function (p) { return p.score_version === 'outcome-v1'; })) {
        arr.sort(function (a, b) { return String(a.created_at || '').localeCompare(String(b.created_at || '')); });
      } else {
        arr.sort(function (a, b) { return (Number(b.score) || 0) - (Number(a.score) || 0); });
      }
    } else if (key === 'posted') {
      arr.sort(function (a, b) { return String(b.posted_at || '').localeCompare(String(a.posted_at || '')); });
    }
    return arr;
  }

  function renderList() {
    var items = sortForTab(activeTab === 'all' ? posts : posts.filter(function (p) { return p.status === activeTab; }), activeTab);
    if (query) items = items.filter(function (p) {
      return [p.text, p.theme, p.score_reason].join(' ').toLowerCase().indexOf(query) >= 0;
    });
    page = Math.min(page, Math.max(0, Math.ceil(items.length / PAGE_SIZE) - 1));
    var start = page * PAGE_SIZE;
    var el = document.getElementById('list');
    if (!items.length) { el.innerHTML = '<div class="empty">' + (query ? '一致する投稿がありません' : 'ここにはまだ何もありません') + '</div>'; updateControls(); return; }
    el.innerHTML = '<p class="list-count">' + items.length + '件中 ' + (start + 1) + '–' + Math.min(start + PAGE_SIZE, items.length) + '件</p>' + items.slice(start, start + PAGE_SIZE).map(renderCard).join('') +
      (items.length > PAGE_SIZE ? '<div class="pager"><button class="ghost" onclick="changePage(-1)"' + (page === 0 ? ' disabled' : '') + '>前へ</button><span>' + (page + 1) + ' / ' + Math.ceil(items.length / PAGE_SIZE) + '</span><button class="ghost" onclick="changePage(1)"' + (start + PAGE_SIZE >= items.length ? ' disabled' : '') + '>次へ</button></div>' : '');
    updateControls();
  }

  function searchPosts(value) { query = value.trim().toLowerCase(); page = 0; renderList(); }
  function changePage(delta) { page += delta; renderList(); window.scrollTo(0, 0); }

  function renderCard(p) {
      // IDは属性・JS文字列の両方で安全な形にする。
      var id = esc(p.id), arg = esc(JSON.stringify(p.id));
      var meta = [
        '<span class="badge b-' + p.status + '">' + (STATUS_LABEL[p.status] || p.status) + '</span>',
        p.category ? '<span>' + (CATEGORY_LABEL[p.category] || esc(p.category)) + '</span>' : '',
        p.format_label ? '<span>' + esc(p.format_label) + '</span>' : '',
        p.edit_group ? '<span>' + esc(p.created_at.slice(0, 10) + ' 回答Q' + p.source_idx + '・' + p.theme) + '</span>' : '',
        p.score !== null ? '<span>' + (p.score_version === 'outcome-v1' ? '新5軸・参考値 ' : '旧スコア ') + p.score + '</span>' : '',
        p.scheduled_at ? '<span>予約 ' + esc(p.scheduled_at) + '</span>' : '',
        p.posted_at ? '<span>投稿 ' + esc(p.posted_at) + '</span>' : '',
      ].filter(Boolean).join('');
      var actions = '';
      if (p.status === 'ready' || p.status === 'stock') {
        actions += '<button class="approve" data-mutation onclick="setStatus(' + arg + ', \'approved\')">承認して予約へ</button>';
      }
      if (['ready', 'stock', 'approved', 'scheduled', 'draft'].indexOf(p.status) >= 0) {
        actions += '<button class="edit" data-mutation onclick="toggleEdit(' + arg + ')">編集</button>';
        actions += '<button class="reject" data-mutation onclick="setStatus(' + arg + ', \'rejected\')">捨てる</button>';
      }
      if (p.status === 'rejected') {
        actions += '<button class="edit" data-mutation onclick="setStatus(' + arg + ', \'stock\')">ストックに戻す</button>';
      }
      var editing = editors[p.id] && editors[p.id].open;
      return (
        '<div class="card" id="card-' + id + '" aria-busy="' + (busy && busyId === p.id) + '">' +
        '<div class="meta">' + meta + '</div>' +
        (p.edit_reason ? '<div class="reason">編集判断: ' + esc(p.edit_reason) + '</div>' : '') +
        (p.publish_note ? '<div class="reason">予約前の確認: ' + esc(p.publish_note) + '</div>' : '') +
        (p.quote_preview ? '<div class="reason" style="white-space:pre-wrap">' + esc(p.quote_preview) + '</div>' : '') +
        '<div class="body-text" id="text-' + id + '"' + (editing ? ' hidden' : '') + '>' + esc(p.text) +
        (p.has_media ? ' <span title="投稿時に画像が添付されます">🖼</span>' : '') + '</div>' +
        (editing ? '<div id="editor-' + id + '"><textarea aria-label="投稿の本文" id="ta-' + id + '" oninput="rememberDraft(' + arg + ', this.value)">' + esc(editors[p.id].text) + '</textarea>' +
        '<div class="reason">保存後は再審査を待ってから承認してください。</div>' +
        '<div class="actions"><button class="save" data-mutation onclick="saveText(' + arg + ')">保存</button>' +
        '<button class="ghost" data-mutation onclick="toggleEdit(' + arg + ')">編集を閉じる</button></div></div>' : '') +
        (p.score_reason ? '<details class="review"><summary>採点コメントを見る</summary><div class="reason">' + esc(p.score_reason) + '</div></details>' : '') +
        (actions ? '<div class="actions">' + actions + '</div>' : '') +
        '</div>'
      );
  }

  function renderCurrent() {
    if (activeTab === 'analytics') { renderAnalytics(); } else { renderList(); }
  }

  function load() {
    if (loading || busy) return;
    loading = true; var version = ++loadVersion;
    activity('最新の投稿を読み込んでいます…'); updateControls();
    google.script.run
      .withSuccessHandler(function (json) {
        if (version !== loadVersion) return;
        loading = false; posts = JSON.parse(json); analyticsData = null;
        activity('更新済み。本文の変更は保存後にバックグラウンドで再審査します。');
        renderTabs(); renderCurrent(); updateControls();
      })
      .withFailureHandler(function (e) {
        if (version !== loadVersion) return;
        loading = false; activity('読み込み失敗: ' + e.message + '。再読込で再試行できます。', true); updateControls();
      })
      .api_listPosts(TOKEN);
  }

  function applyMutation(id, json) {
    var result = JSON.parse(json);
    if (result.post) posts = posts.map(function (p) { return p.id === id ? result.post : p; });
    finishMutation(result.message || '保存しました');
    renderTabs(); renderCurrent();
  }

  function setStatus(id, status) {
    if (hasUnsaved(id)) { activity('編集した本文を先に保存してください。', true); return; }
    if (!beginMutation('状態を保存しています…', id)) return;
    google.script.run
      .withSuccessHandler(function (json) { delete editors[id]; applyMutation(id, json); })
      .withFailureHandler(function (e) { finishMutation('状態を確認できませんでした: ' + e.message + '。再読込で確認してください。', true); })
      .api_setStatus(TOKEN, id, status, '', { includePost: true });
  }

  function toggleEdit(id) {
    if (busy || loading) return;
    var post = posts.filter(function (p) { return p.id === id; })[0];
    if (!editors[id]) editors[id] = { text: post.text, open: false };
    editors[id].open = !editors[id].open;
    document.getElementById('card-' + id).outerHTML = renderCard(post);
    if (editors[id].open) document.getElementById('ta-' + id).focus();
  }

  function rememberDraft(id, text) { editors[id].text = text; }
  function hasUnsaved(id) {
    return posts.some(function (p) { return (!id || p.id === id) && editors[p.id] && editors[p.id].text !== p.text; });
  }
  window.addEventListener('beforeunload', function (event) {
    if (hasUnsaved() || busy) { event.preventDefault(); event.returnValue = ''; }
  });

  function saveText(id) {
    var value = document.getElementById('ta-' + id).value;
    rememberDraft(id, value);
    if (!value.trim()) { activity('本文を入力してください。', true); return; }
    if (!beginMutation('本文を保存しています…', id)) return;
    google.script.run
      .withSuccessHandler(function (json) { delete editors[id]; applyMutation(id, json); })
      .withFailureHandler(function (e) { finishMutation('保存を確認できませんでした: ' + e.message + '。入力内容は画面に残しています。', true); })
      .api_updateText(TOKEN, id, value, '', { includePost: true });
  }

  function canBatch() {
    if (busy || loading) return false;
    if (hasUnsaved()) { activity('編集中の本文を保存してから一括操作してください。', true); return false; }
    return true;
  }
  function batchSuccess(message) { finishMutation(message); load(); activity(message); }
  function batchFailure(e) { finishMutation('処理結果を確認できませんでした: ' + e.message + '。再読込で確認してください。', true); }

  function refineNow() {
    if (!canBatch() || !beginMutation('リライト＋再採点を実行中…（1分以上かかる場合があります）')) return;
    google.script.run
      .withSuccessHandler(batchSuccess)
      .withFailureHandler(batchFailure)
      .api_refineNow(TOKEN);
  }

  function approveAll() {
    if (!canBatch()) return;
    var n = posts.filter(function (p) { return p.status === 'ready'; }).length;
    if (!n) { toast('承認待ちが0件です'); return; }
    if (!confirm('承認待ち ' + n + '件をすべて承認しますか？')) return;
    if (!beginMutation('一括承認中…')) return;
    google.script.run
      .withSuccessHandler(batchSuccess)
      .withFailureHandler(batchFailure)
      .api_approveAll(TOKEN);
  }

  function forceApproveStock() {
    if (!canBatch()) return;
    var n = posts.filter(function (p) { return p.status === 'stock' || p.status === 'ready'; }).length;
    if (!n) { toast('保留ストック・承認待ちが0件です'); return; }
    if (!confirm('採点に関係なく、保留ストックと承認待ちの ' + n + '件をすべて承認して予約します。よろしいですか？')) return;
    if (!beginMutation('強制承認と予約を実行中…')) return;
    google.script.run
      .withSuccessHandler(batchSuccess)
      .withFailureHandler(batchFailure)
      .api_forceApproveStock(TOKEN);
  }

  function scheduleNow() {
    if (!canBatch() || !beginMutation('承認済みの投稿を予約しています…')) return;
    google.script.run
      .withSuccessHandler(function (json) {
        var n = JSON.parse(json).length;
        batchSuccess(n ? n + '件を予約しました' : '予約対象（承認済み）がありません');
      })
      .withFailureHandler(batchFailure)
      .api_scheduleNow(TOKEN);
  }

  load();
</script>
